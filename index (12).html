<body>

<div id="offline-banner" class="offline-banner">📡 Sem internet — dados serão sincronizados quando conectar</div>
<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:40px">⚡</div>
      <div style="font-size:20px;font-weight:800;color:#fff;margin-top:8px">Checklist AT</div>

    </div>

    <div class="field"><label>Código de acesso</label><input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>

</div>

  <div class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="header-icon">⚡</div>
        <div>
          <div class="header-title">Checklist AT — EDP-ES DEPA</div>
          <div class="header-sub" id="conn-status">● Conectado</div>
        </div>
      </div>
      <button class="user-badge" id="user-badge" onclick="doLogout()">Sair</button>
    </div>
  </div>
  <div class="tabs" id="main-tabs">
    <button class="tab active" onclick="showMain('home')">🏠 Início</button>
    <button class="tab" onclick="showMain('checklist')">📋 Checklist Inicial</button>
    <button class="tab" onclick="showMain('mov')">🚛 Movimentação</button>
    <button class="tab" onclick="showMain('asbuilt')">📐 As Built</button>
    <button class="tab" onclick="showMain('final')">✅ Final de Obra</button>
    <button class="tab" onclick="showMain('painel')">📊 Painel</button>
  </div>
  <div id="submenu-bar" style="display:none">
    <div class="submenu" id="submenu"></div>
  </div>
  <div class="content" id="main-content"></div>
</div>
<div id="modal-container"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCaXndhr4By1CSmQcWVeRQkkQTtjieELPI",
  authDomain: "checklist-at.firebaseapp.com",
  projectId: "checklist-at",
  storageBucket: "checklist-at.firebasestorage.app",
  messagingSenderId: "455879274955",
  appId: "1:455879274955:web:cfa47b27909f64992c864e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const col = collection(db, "registros");
const ADMIN_EMAILS = ["jose.luis.junior@edp.com","jose.chiabai@edp.com"];
const ADMIN_CODES = ["DEPA@2024"];

let currentUser=null, isAdmin=false, gpsCoords=null, allRegistros=[], saving=false, listenerStarted=false;
let mainTab='home', subTab='rec';
const photoStores={}, checkState={}, ynState={}, txtState={}, selState={};
const eqSelected={rec:[],ent:[]};
const accOpen={}, successState={rec:false,ent:false,lib:false,mov:false,asbuilt:false,final:false};
let painelFiltro='';
const danosState={};
// movimentacao items
let movItems=[];
// asbuilt items
let asbuiltItems=[];

const $=id=>document.getElementById(id);

// ── AUTH ──────────────────────────────────────────────────
// ── SESSION LOCAL (funciona offline) ─────────────────────
function saveSession(user) {
  if(!user) { localStorage.removeItem('checklist_session'); return; }
  localStorage.setItem('checklist_session', JSON.stringify({...user, savedAt: Date.now()}));
}
function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem('checklist_session')||'null');
    if(!s) return null;
    if(Date.now() - s.savedAt > 60*24*60*60*1000) { localStorage.removeItem('checklist_session'); return null; } // 60 dias
    return s;
  } catch { return null; }
}

// Session loading moved to after all functions are defined (see bottom of script)
window.doLogin=()=>{
  const email=($('login-email').value||'').trim().toLowerCase();
  const pass=$('login-pass').value.trim();
  const err=$('login-error');
  err.style.display='none';
  // Verifica engenheiro
  if(ADMIN_EMAILS.includes(email) && ADMIN_CODES.includes(pass)) {
    const user={uid:'eng_'+email.split('@')[0], email, isAdmin:true, savedAt:Date.now()};
    currentUser=user; isAdmin=true;
    saveSession(user); showApp();
  } else if(ADMIN_EMAILS.includes(email) && !ADMIN_CODES.includes(pass)) {
    err.textContent='Código de acesso incorreto.'; err.style.display='block';
  } else {
    err.textContent='E-mail não reconhecido como engenheiro.'; err.style.display='block';
  }
};
window.doLoginTech=()=>{
  const user={uid:'tech_'+Date.now(), email:null, isAdmin:false, savedAt:Date.now()};
  currentUser=user; isAdmin=false;
  saveSession(user); showApp();
};
window.doLogout=()=>{
  saveSession(null);
  currentUser=null; isAdmin=false;
  showLogin();
};
function showLogin(){
  $('login-screen').style.display='flex';
  $('app-screen').style.display='none';
}
function showApp(){
  try {
    $('login-screen').style.display='none';
    $('app-screen').style.display='block';
    const badge=$('user-badge');
    if(badge){
      if(isAdmin){badge.textContent='👤 Engenheiro · Sair';badge.className='user-badge user-admin';}
      else{badge.textContent='🔧 Técnico · Sair';badge.className='user-badge user-tech';}
    }
    try { getGPS(); } catch(e){ console.warn('GPS erro:',e); }
    try { renderPage(); } catch(e){ console.warn('renderPage erro:',e); }
    try { startListener(); } catch(e){ console.warn('startListener erro:',e); }
  } catch(e){ console.error('showApp erro:',e); }
}

// ── GPS ───────────────────────────────────────────────────
function getGPS(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(pos=>{
    gpsCoords={lat:pos.coords.latitude.toFixed(6),lng:pos.coords.longitude.toFixed(6),acc:Math.round(pos.coords.accuracy)};
    renderPage();
  },()=>{gpsCoords=null;});
}
function gpsBox(){
  if(gpsCoords)return`<div class="gps-box"><div style="font-size:18px">📍</div><div><div style="font-size:11px;color:#7A92AE">Localização capturada</div><div style="font-size:12px;color:#2ECC71;font-weight:600">Lat: ${gpsCoords.lat} | Lng: ${gpsCoords.lng} (±${gpsCoords.acc}m)</div></div></div>`;
  return`<div class="gps-box"><div style="font-size:18px">📍</div><div style="color:#7A92AE;font-size:12px">Aguardando localização GPS...</div></div>`;
}

// ── PHOTO ─────────────────────────────────────────────────
function compressImage(dataUrl,maxW=800,maxH=800,quality=0.6){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxW||h>maxH){const r=Math.min(maxW/w,maxH/h);w=Math.round(w*r);h=Math.round(h*r);}
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      res(canvas.toDataURL('image/jpeg',quality));
    };
    img.src=dataUrl;
  });
}
function getPhotos(id){return photoStores[id]||[];}
window.handleFiles=async(id,input)=>{
  for(const f of Array.from(input.files)){
    await new Promise(res=>{
      const reader=new FileReader();
      reader.onload=async e=>{
        const compressed=await compressImage(e.target.result);
        photoStores[id]=[...(photoStores[id]||[]),{name:f.name,data:compressed}];
        renderThumbs(id);res();
      };
      reader.readAsDataURL(f);
    });
  }
  input.value='';
};
window.removePhotoGlobal=(id,idx)=>{photoStores[id]=photoStores[id].filter((_,i)=>i!==idx);renderThumbs(id);};
function renderThumbs(id){
  const el=$(`thumbs-${id}`);if(!el)return;
  el.innerHTML=getPhotos(id).map((p,i)=>`<div class="photo-thumb"><img src="${p.data}"/><button class="remove" onclick="removePhotoGlobal('${id}',${i})">✕</button></div>`).join('');
  const drop=$(`drop-${id}`);if(drop)drop.classList.toggle('missing',getPhotos(id).length===0&&drop.dataset.required==='1');
}
function refreshAllThumbs(){
  Object.keys(photoStores).forEach(id=>{if(photoStores[id]&&photoStores[id].length)renderThumbs(id);});
}
function photoSection(id,label,hint='',required=true,minCount=1){
  return`<div class="photo-section">
    <span style="display:block;font-size:11px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px;color:#7A92AE">${label}${required?` <span style="color:#E74C3C">* obrigatório${minCount>1?' (mín. '+minCount+')':''}</span>`:''}</span>
    ${hint?`<div style="color:#F5A623;font-size:11px;margin-bottom:8px;font-style:italic">⚠️ ${hint}</div>`:''}
    <div class="photo-drop${required&&getPhotos(id).length===0?' missing':''}" id="drop-${id}" data-required="${required?1:0}" onclick="document.getElementById('file-${id}').click()">

function textarea(id,label,placeholder='',rows=3){

window.resetForm=key=>{
  successState[key]=false;
  const p=key+'_';
  Object.keys(checkState).forEach(k=>{if(k.startsWith(p))delete checkState[k];});
  Object.keys(ynState).forEach(k=>{if(k.startsWith(k.startsWith(p)))delete ynState[k];});
  Object.keys(txtState).forEach(k=>{if(k.startsWith(p))delete txtState[k];});
  Object.keys(selState).forEach(k=>{if(k.startsWith(p))delete selState[k];});
  Object.keys(photoStores).forEach(k=>{if(k.startsWith(p)||k.startsWith('dano_'+p))delete photoStores[k];});
  Object.keys(danosState).forEach(k=>{if(k.startsWith(p))delete danosState[k];});
  eqSelected[key]&&(eqSelected[key]=[]);
  if(key==='mov'){movItems=[];}
  if(key==='asbuilt'){asbuiltItems=[];}
  renderPage();
};

window.removeDano=(eqKey,idx)=>{danosState[eqKey].splice(idx,1);renderPage();};
window.setDanoDesc=(eqKey,idx,val)=>{if(!danosState[eqKey])danosState[eqKey]=[];danosState[eqKey][idx].desc=val;};
function collectDanos(eqKey){return getDanos(eqKey).map(d=>({desc:d.desc,photos:(photoStores[d.photoId]||[]).map(p=>p.data)}));}
function danosSection(eqKey){
  const danos=getDanos(eqKey);

// ── SAVE ──────────────────────────────────────────────────
function collectPhotos(keys){const r={};keys.forEach(k=>{const p=getPhotos(k);if(p.length)r[k]=p.map(x=>x.data);});return r;}
async function saveDoc(data,photoKeys){
  saving=true;renderPage();
  try{
    const photos=collectPhotos(photoKeys);
    await addDoc(col,{...data,photos,gps:gpsCoords||null,timestamp:Date.now(),data:new Date().toLocaleString('pt-BR'),createdBy:currentUser?.uid||'anon',createdByEmail:currentUser?.email||'tecnico'});
    saving=false;return true;
  }catch(e){
    console.error(e);
    if(!navigator.onLine){
      alert('Sem internet. Conecte-se e tente novamente.');
    } else if(e.message&&e.message.includes('exceeds')){
      alert('Muitas fotos. Tente com menos fotos por registro.');
    } else {
      alert('Erro ao salvar: '+e.message);
    }
    saving=false;renderPage();return false;
  }
}
window.deleteRegistro=async id=>{
  if(!isAdmin){alert('Apenas o engenheiro pode excluir registros.');return;}
  if(!confirm('Excluir este registro permanentemente?'))return;
  try{await deleteDoc(doc(db,'registros',id));renderPainel();}
  catch(e){alert('Erro ao excluir: '+e.message);}
};

window.showMain=tab=>{
  mainTab=tab;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['home','checklist','mov','asbuilt','final','painel'][i]===tab));
  const subBar=$('submenu-bar');
  if(tab==='checklist'){
    subBar.style.display='block';
    $('submenu').innerHTML=`
      <button class="subtab${subTab==='rec'?' active':''}" onclick="showSub('rec')">📦 Recebimento</button>
      <button class="subtab${subTab==='ent'?' active':''}" onclick="showSub('ent')">🤝 Entrega</button>
      <button class="subtab${subTab==='lib'?' active':''}" onclick="showSub('lib')">⚡ Liberação</button>`;
  }else{subBar.style.display='none';}
  renderPage();
};
window.showSub=tab=>{
  subTab=tab;
  document.querySelectorAll('.subtab').forEach(el=>{el.classList.toggle('active',el.textContent.includes({rec:'Recebimento',ent:'Entrega',lib:'Liberação'}[tab]));});
  renderPage();
};

function renderPage(){
  const c=$('main-content');if(!c)return;
  let html='';
  if(mainTab==='home')html=renderHome();
  else if(mainTab==='checklist'){
    if(subTab==='rec')html=renderRec();
    else if(subTab==='ent')html=renderEnt();
    else if(subTab==='lib')html=renderLib();
  }
  else if(mainTab==='mov')html=renderMov();
  else if(mainTab==='asbuilt')html=renderAsBuilt();
  else if(mainTab==='final')html=renderFinal();
  else if(mainTab==='painel'){renderPainel();return;}
  c.innerHTML=html;
  refreshAllThumbs();
}

  const lista=allRegistros.filter(r=>!painelFiltro||
    r.sub?.toLowerCase().includes(painelFiltro.toLowerCase())||
    r.nome?.toLowerCase().includes(painelFiltro.toLowerCase())||
    r.nomeObra?.toLowerCase().includes(painelFiltro.toLowerCase())||
    (r.selected||[]).join(' ').toLowerCase().includes(painelFiltro.toLowerCase())||
    r.eq?.toLowerCase().includes(painelFiltro.toLowerCase())||
    r.tipoLabel?.toLowerCase().includes(painelFiltro.toLowerCase())
  );
  const cM={'1_recebimento':'blue','2_entrega':'green','3_liberacao':'red','4_movimentacao':'blue','5_asbuilt':'purple','6_final':'green'};
  const aBtns=id=>isAdmin?`<button class="btn-sm btn-del" onclick="deleteRegistro('${id}')">🗑 Excluir</button>`:`<button class="btn-sm" style="background:#1C2D45;color:#7A92AE;cursor:default">👁 Ver</button>`;
  const cards=lista.length===0?`<div class="empty">Nenhum registro encontrado.</div>`:lista.map(r=>`
    <div class="card">
      <div class="card-top"><span class="badge ${cM[r.tipo]||'blue'}">${r.tipoLabel}</span><span class="card-date">${r.data||''}</span></div>
      <div class="card-title">${(r.selected||[r.eq||r.tipoLabel||'']).join(', ')} — ${r.sub||''}</div>
      <div class="card-sub">${r.tipo==='2_entrega'?`Obra: ${r.nomeObra} · Manutenção: ${r.nomeManut}`:`Responsável: ${r.nome||''}`}</div>
      ${r.gps?`<div style="color:#2ECC71;font-size:11px;margin-top:4px">📍 ${r.gps.lat}, ${r.gps.lng}</div>`:''}
      ${r.tipo==='3_liberacao'?`<div style="margin-top:8px"><span class="badge ${r.apto==='Sim'?'green':'red'}">${r.apto==='Sim'?'⚡ Apto para energização':'🔴 Com pendências'}</span></div>`:''}
      ${r.tipo==='6_final'?`<div style="margin-top:8px"><span class="badge ${r.apto==='Sim'?'green':'red'}">${r.apto==='Sim'?'✅ Obra concluída':'🔴 Com pendências'}</span></div>`:''}
      <div class="card-actions">${aBtns(r.id)}</div>
    </div>`).join('');
  c.innerHTML=`<h2 class="page-title">Painel de Registros</h2>
    <p class="page-sub">${isAdmin?'Engenheiro — acesso completo ☁️':'Técnico — visualização ☁️'}</p>
    <div class="panel-count">${allRegistros.length} registro${allRegistros.length!==1?'s':''} na nuvem</div>
    <input class="search-input" placeholder="Buscar por subestação, tipo, responsável..." value="${painelFiltro}" oninput="setPainelFiltro(this.value)"/>
    ${cards}`;
}

window.saveMov=async()=>{
  const nome=getTxt('mov_nome'),sub=getTxt('mov_sub');
  if(!nome||!sub)return alert('Preencha Nome e Subestação.');
  if(!movItems.length)return alert('Adicione pelo menos um equipamento movimentado.');
  for(let i=0;i<movItems.length;i++){
    const item=movItems[i];
    if(!item.tipo)return alert(`Informe o tipo de movimentação do equipamento ${i+1}.`);
    if(!item.local)return alert(`Informe o tipo de local do equipamento ${i+1}.`);
    if(!item.fase)return alert(`Informe a fase do equipamento ${i+1}.`);
    const tipo=item.tipo;
    if((tipo==='Substituição'||tipo==='Instalação')&&!getPhotos(`mov_${i}_placa_inst`).length)return alert(`Adicione foto da placa do equipamento instalado (item ${i+1}).`);
    if((tipo==='Substituição'||tipo==='Instalação')&&getPhotos(`mov_${i}_placa_inst`).length<2)return alert(`Adicione pelo menos 2 fotos da placa do equipamento instalado (item ${i+1}).`);
    if((tipo==='Substituição'||tipo==='Instalação')&&!getPhotos(`mov_${i}_eq_inst`).length)return alert(`Adicione foto do equipamento instalado (item ${i+1}).`);
    if((tipo==='Substituição'||tipo==='Desativação')&&!getPhotos(`mov_${i}_placa_des`).length)return alert(`Adicione foto da placa do equipamento desativado (item ${i+1}).`);
    if((tipo==='Substituição'||tipo==='Desativação')&&getPhotos(`mov_${i}_placa_des`).length<2)return alert(`Adicione pelo menos 2 fotos da placa do equipamento desativado (item ${i+1}).`);
    if((tipo==='Substituição'||tipo==='Desativação')&&!getPhotos(`mov_${i}_eq_des`).length)return alert(`Adicione foto do equipamento retirado (item ${i+1}).`);
    if(tipo==='Realocação'&&(!getPhotos(`mov_${i}_placa_real`).length||getPhotos(`mov_${i}_placa_real`).length<2))return alert(`Adicione pelo menos 2 fotos da placa do equipamento realocado (item ${i+1}).`);
    if(tipo==='Realocação'&&!getPhotos(`mov_${i}_eq_real`).length)return alert(`Adicione foto do equipamento realocado (item ${i+1}).`);
    if(tipo==='Aquisição'&&(!getPhotos(`mov_${i}_placa_aqui`).length||getPhotos(`mov_${i}_placa_aqui`).length<2))return alert(`Adicione pelo menos 2 fotos da placa do equipamento adquirido (item ${i+1}).`);
    if(tipo==='Aquisição'&&!getPhotos(`mov_${i}_eq_aqui`).length)return alert(`Adicione foto do equipamento adquirido (item ${i+1}).`);
    if(tipo==='Empréstimo'&&(!getPhotos(`mov_${i}_placa_emp`).length||getPhotos(`mov_${i}_placa_emp`).length<2))return alert(`Adicione pelo menos 2 fotos da placa do equipamento emprestado (item ${i+1}).`);
    if(tipo==='Empréstimo'&&!getPhotos(`mov_${i}_eq_emp`).length)return alert(`Adicione foto do equipamento emprestado (item ${i+1}).`);
  }
  const allPhotoKeys=[];
  movItems.forEach((_,i)=>{
    ['placa_inst','eq_inst','placa_des','eq_des','placa_real','eq_real','placa_aqui','eq_aqui','placa_emp','eq_emp'].forEach(k=>allPhotoKeys.push(`mov_${i}_${k}`));
  });
  const itemsData=movItems.map((item,i)=>({...item,
    fotos:{
      placaInst:(photoStores[`mov_${i}_placa_inst`]||[]).map(p=>p.data),
      eqInst:(photoStores[`mov_${i}_eq_inst`]||[]).map(p=>p.data),
      placaDes:(photoStores[`mov_${i}_placa_des`]||[]).map(p=>p.data),
      eqDes:(photoStores[`mov_${i}_eq_des`]||[]).map(p=>p.data),
      placaReal:(photoStores[`mov_${i}_placa_real`]||[]).map(p=>p.data),

      eqAqui:(photoStores[`mov_${i}_eq_aqui`]||[]).map(p=>p.data),
      placaEmp:(photoStores[`mov_${i}_placa_emp`]||[]).map(p=>p.data),
      eqEmp:(photoStores[`mov_${i}_eq_emp`]||[]).map(p=>p.data),
    }
  }));
  const ok=await saveDoc({tipo:'4_movimentacao',tipoLabel:'Movimentação de Equipamentos',nome,sub,movItems:itemsData},{});
  if(ok){successState.mov=true;movItems=[];renderPage();}

// ── LISTENER ──────────────────────────────────────────────
function startListener(){
  if(listenerStarted)return;
  listenerStarted=true;
  try {
    onSnapshot(
      query(col,orderBy('timestamp','desc')),
      snap=>{
        allRegistros=snap.docs.map(d=>({id:d.id,...d.data()}));
        if($('main-content')&&mainTab==='painel')renderPainel();
      },
      err=>{
        console.warn('[Firestore] Offline ou erro:',err.message);
        listenerStarted=false; // allow retry when back online
      }
    );
  } catch(e){
    console.warn('[Firestore] startListener erro:',e.message);
    listenerStarted=false;
  }
}
